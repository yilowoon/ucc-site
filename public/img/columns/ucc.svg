<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="도시공동체본부, 혁신형 중간조직으로서 두 세계를 연결">
  <defs>
    <linearGradient id="uc-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e5a47"/><stop offset="1" stop-color="#123a2e"/></linearGradient>
    <radialGradient id="uc-hub" cx="0.5" cy="0.4" r="0.7"><stop offset="0" stop-color="#dcb26a"/><stop offset="1" stop-color="#b8863b"/></radialGradient>
    <style>text{font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif}</style>
  </defs>
  <rect width="1200" height="620" rx="26" fill="#f4f1e9"/>
  <circle cx="600" cy="310" r="260" fill="#cd9b4c" opacity="0.06"/>
  <text x="600" y="66" text-anchor="middle" font-size="26" font-weight="800" fill="#123a2e">두 세계를 잇는 혁신형 중간조직</text>

  <!-- 연결선 -->
  <g stroke="#b8863b" stroke-width="3" opacity="0.8">
    <line x1="600" y1="330" x2="210" y2="210"/><line x1="600" y1="330" x2="190" y2="340"/><line x1="600" y1="330" x2="210" y2="470"/>
    <line x1="600" y1="330" x2="990" y2="210"/><line x1="600" y1="330" x2="1010" y2="340"/><line x1="600" y1="330" x2="990" y2="470"/>
  </g>

  <!-- 왼쪽: 사회연대경제 조직 -->
  <g text-anchor="middle" font-size="15" font-weight="700" fill="#fff">
    <g transform="translate(160 210)"><circle r="46" fill="url(#uc-g)"/><text y="-2">협동</text><text y="16">조합</text></g>
    <g transform="translate(140 340)"><circle r="46" fill="url(#uc-g)"/><text y="-2">사회적</text><text y="16">기업</text></g>
    <g transform="translate(160 470)"><circle r="46" fill="url(#uc-g)"/><text y="-2">마을·자활</text><text y="16">기업</text></g>
  </g>
  <text x="150" y="548" text-anchor="middle" font-size="16" font-weight="700" fill="#1e5a47">사회연대경제 조직</text>

  <!-- 오른쪽: 혁신 자원 -->
  <g text-anchor="middle" font-size="15" font-weight="700" fill="#fff">
    <g transform="translate(1040 210)"><circle r="46" fill="#2a6b54"/><text y="-2">기업</text><text y="16">R&amp;D</text></g>
    <g transform="translate(1060 340)"><circle r="46" fill="#2a6b54"/><text y="-2">대학·</text><text y="16">연구기관</text></g>
    <g transform="translate(1040 470)"><circle r="46" fill="#2a6b54"/><text y="-2">혁신</text><text y="16">기관</text></g>
  </g>
  <text x="1050" y="548" text-anchor="middle" font-size="16" font-weight="700" fill="#1e5a47">혁신 생태계 자원</text>

  <!-- 중앙 허브 -->
  <g transform="translate(600 330)">
    <circle r="108" fill="url(#uc-hub)"/>
    <circle r="108" fill="none" stroke="#fff" stroke-width="3" opacity="0.5"/>
    <text x="0" y="-18" text-anchor="middle" font-size="30" font-weight="800" fill="#123a2e">UCC</text>
    <text x="0" y="12" text-anchor="middle" font-size="16" font-weight="700" fill="#123a2e">도시공동체본부</text>
    <text x="0" y="40" text-anchor="middle" font-size="14" font-weight="600" fill="#3a2b12">혁신 진단·실증·사업화</text>
  </g>
</svg>

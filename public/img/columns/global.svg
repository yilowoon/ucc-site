<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="해외 협동조합의 기술 혁신과 혁신형 중간조직">
  <defs>
    <linearGradient id="gl-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e5a47"/><stop offset="1" stop-color="#123a2e"/></linearGradient>
    <linearGradient id="gl-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dcb26a"/><stop offset="1" stop-color="#b8863b"/></linearGradient>
    <style>text{font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif}</style>
  </defs>
  <rect width="1200" height="620" rx="26" fill="#f4f1e9"/>
  <circle cx="1050" cy="130" r="210" fill="#1e5a47" opacity="0.05"/>
  <circle cx="180" cy="520" r="200" fill="#cd9b4c" opacity="0.08"/>

  <!-- 지구본(세계 시장) -->
  <g transform="translate(900 230)">
    <circle r="130" fill="url(#gl-g)"/>
    <g fill="none" stroke="#dcb26a" stroke-width="2.5" opacity="0.8">
      <circle r="130"/><ellipse rx="52" ry="130"/><ellipse rx="100" ry="130"/>
      <path d="M-130 0 H130"/><path d="M-120 -56 H120"/><path d="M-120 56 H120"/>
    </g>
    <circle r="130" fill="none" stroke="url(#gl-gold)" stroke-width="5"/>
    <text x="0" y="178" text-anchor="middle" font-size="22" font-weight="800" fill="#123a2e">세계 시장 · 해외 매출</text>
  </g>

  <!-- 맞물린 기어(기술 혁신) -->
  <g transform="translate(330 300)">
    <g fill="url(#gl-g)">
      <path d="M0-150 l26 12 a164 164 0 0 1 45 26 l28-10 22 38-21 21 a164 164 0 0 1 0 52 l21 21-22 38-28-10 a164 164 0 0 1-45 26 l-26 12-26-12 a164 164 0 0 1-45-26 l-28 10-22-38 21-21 a164 164 0 0 1 0-52 l-21-21 22-38 28 10 a164 164 0 0 1 45-26z"/>
      <circle r="72" fill="#f4f1e9"/>
    </g>
    <circle r="40" fill="none" stroke="url(#gl-gold)" stroke-width="8"/>
    <circle r="10" fill="#cd9b4c"/>
    <!-- 작은 기어 -->
    <g transform="translate(135 110)" fill="url(#gl-gold)">
      <path d="M0-78 l16 8 a86 86 0 0 1 22 13 l16-6 12 20-12 12 a86 86 0 0 1 0 28 l12 12-12 20-16-6 a86 86 0 0 1-22 13 l-16 8-16-8 a86 86 0 0 1-22-13 l-16 6-12-20 12-12 a86 86 0 0 1 0-28 l-12-12 12-20 16 6 a86 86 0 0 1 22-13z"/>
      <circle r="34" fill="#f4f1e9"/>
    </g>
    <text x="0" y="214" text-anchor="middle" font-size="22" font-weight="800" fill="#123a2e">기술 · 제품 혁신</text>
  </g>

  <!-- 연결선 -->
  <path d="M520 300 C 640 260 680 240 770 230" fill="none" stroke="url(#gl-gold)" stroke-width="6" stroke-dasharray="2 12" stroke-linecap="round"/>
</svg>

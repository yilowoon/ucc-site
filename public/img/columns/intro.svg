<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="협동과 혁신: 사람이 주인인 기업">
  <defs>
    <linearGradient id="in-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e5a47"/><stop offset="1" stop-color="#123a2e"/>
    </linearGradient>
    <linearGradient id="in-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcb26a"/><stop offset="1" stop-color="#b8863b"/>
    </linearGradient>
    <style>text{font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif}</style>
  </defs>
  <rect width="1200" height="620" rx="26" fill="#f4f1e9"/>
  <circle cx="200" cy="120" r="200" fill="#1e5a47" opacity="0.06"/>
  <circle cx="1030" cy="520" r="230" fill="#cd9b4c" opacity="0.08"/>

  <!-- 왼쪽: 협동(연대) 고리 -->
  <g transform="translate(300 310)">
    <circle r="150" fill="none" stroke="#1e5a47" stroke-width="2" stroke-dasharray="4 8" opacity="0.5"/>
    <g fill="url(#in-g)">
      <g transform="rotate(0)"><g transform="translate(0 -150)"><circle cy="-10" r="16"/><rect x="-18" y="6" width="36" height="34" rx="16"/></g></g>
      <g transform="rotate(60)"><g transform="translate(0 -150)"><circle cy="-10" r="16"/><rect x="-18" y="6" width="36" height="34" rx="16"/></g></g>
      <g transform="rotate(120)"><g transform="translate(0 -150)"><circle cy="-10" r="16"/><rect x="-18" y="6" width="36" height="34" rx="16"/></g></g>
      <g transform="rotate(180)"><g transform="translate(0 -150)"><circle cy="-10" r="16"/><rect x="-18" y="6" width="36" height="34" rx="16"/></g></g>
      <g transform="rotate(240)"><g transform="translate(0 -150)"><circle cy="-10" r="16"/><rect x="-18" y="6" width="36" height="34" rx="16"/></g></g>
      <g transform="rotate(300)"><g transform="translate(0 -150)"><circle cy="-10" r="16"/><rect x="-18" y="6" width="36" height="34" rx="16"/></g></g>
    </g>
    <!-- 중심: 사람이 주인 -->
    <circle r="64" fill="#fff" stroke="url(#in-gold)" stroke-width="6"/>
    <g fill="url(#in-g)"><circle cy="-16" r="22"/><path d="M-30 34 a30 30 0 0 1 60 0 z"/></g>
    <text x="0" y="112" text-anchor="middle" font-size="26" font-weight="800" fill="#123a2e">협동 · 連帶</text>
  </g>

  <!-- 연결 띠 -->
  <path d="M470 310 C 560 310 580 310 660 310" fill="none" stroke="url(#in-gold)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="565" cy="310" r="9" fill="#cd9b4c"/>

  <!-- 오른쪽: 혁신(기어 + 상승 + 스파크) -->
  <g transform="translate(850 310)">
    <g fill="url(#in-g)">
      <path d="M0-120 l22 10 a132 132 0 0 1 36 21 l23-8 18 31-17 17 a132 132 0 0 1 0 42 l17 17-18 31-23-8 a132 132 0 0 1-36 21 l-22 10-22-10 a132 132 0 0 1-36-21 l-23 8-18-31 17-17 a132 132 0 0 1 0-42 l-17-17 18-31 23 8 a132 132 0 0 1 36-21z"/>
      <circle r="58" fill="#f4f1e9"/>
    </g>
    <!-- 상승 화살표 -->
    <path d="M-26 28 L-4 2 L14 20 L40 -16" fill="none" stroke="url(#in-gold)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 -20 L44 -20 L44 2" fill="none" stroke="url(#in-gold)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 스파크 -->
    <g stroke="#fba83e" stroke-width="5" stroke-linecap="round"><path d="M70-96 l0-22M70-96 l16-12M70-96 l-16-12"/></g>
    <text x="0" y="132" text-anchor="middle" font-size="26" font-weight="800" fill="#123a2e">혁신 · 革新</text>
  </g>
</svg>

# =============================================================
#  UCC 사이트 nginx 보안 스니펫
#  - 숨김파일(.env/.git 등) 접근 차단
#  - 대표 스캔 경로(워드프레스/PHP/DB도구) 즉시 종료
#  적용: 아래 location 블록들을 /etc/nginx/sites-available/ucc 의
#        server { ... } 블록 "안"에 붙여넣고 reload.
#        (proxy_pass 등 기존 location 보다 위쪽/같은 레벨에 두면 됩니다)
# =============================================================

# 1) 숨김파일 접근 차단 — 단, Let's Encrypt 인증서 갱신용 /.well-known 은 허용(필수)
location ~ /\.(?!well-known) {
    deny all;
    access_log off;
    return 404;
}

# 2) 알려진 스캔 경로는 응답 없이 연결 종료(444) — 로그도 남기지 않음
location ~* (?:^/wp-|/wordpress/|xmlrpc\.php|wlwmanifest|/phpmyadmin|/pma/|/adminer|/vendor/|/\.git|/\.env|/\.aws|/\.ssh) {
    access_log off;
    return 444;
}

# 3) 존재하지 않는 서버 스크립트(.php/.asp 등)도 차단 (이 사이트는 Node.js)
location ~* \.(?:php|asp|aspx|jsp|cgi)$ {
    access_log off;
    return 444;
}

# =============================================================
#  참고: nginx 는 반드시 "root 로 프로젝트 폴더를 직접 서빙"하지 말고
#  Node 앱으로 proxy_pass 만 해야 합니다. 예)
#
#  location / {
#      proxy_pass http://127.0.0.1:3000;
#      proxy_set_header Host $host;
#      proxy_set_header X-Real-IP $remote_addr;
#      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#      proxy_set_header X-Forwarded-Proto $scheme;
#  }
#
#  이렇게 하면 .env/.git 같은 파일은 애초에 nginx가 서빙할 대상이 아니라
#  노출 자체가 불가능합니다. (정적 파일은 Node의 /public, /uploads 로만 제공)
# =============================================================
